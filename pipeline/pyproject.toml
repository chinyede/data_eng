[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RTChiruka", email = "41325214+chinyede@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.6",
    "tqdm>=4.70.1",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.6.3",
    "pgcli>=4.7.1",
]
